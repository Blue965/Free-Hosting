<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Free Hosting</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <a href="index.html" class="navbar-brand">
                <div class="navbar-logo">FH</div>
                <span class="navbar-name">Free Hosting</span>
            </a>
            <ul class="navbar-nav">
                <li><a href="index.html" class="navbar-link">Home</a></li>
                <li><a href="hosting.html" class="navbar-link">Hosting</a></li>
                <li><a href="index.html#features" class="navbar-link">Features</a></li>
                <li><a href="status.html" class="navbar-link">Status</a></li>
                <li><a href="faq.html" class="navbar-link">FAQ</a></li>
            </ul>
            <div class="navbar-actions navbar-auth">
                <a href="login.html" class="btn btn-secondary">Login</a>
                <a href="register.html" class="btn btn-primary">Create Account</a>
            </div>
            <div class="navbar-actions navbar-user hidden">
                <a href="dashboard.html" class="btn btn-secondary">Dashboard</a>
                <a href="account.html" class="btn btn-secondary">Profile</a>
                <button id="logout-btn" class="btn btn-danger">Logout</button>
            </div>
            <button class="navbar-toggle" id="navbar-toggle">☰</button>
        </div>
    </nav>

    <div class="navbar-mobile" id="navbar-mobile">
        <a href="index.html" class="navbar-mobile-link">Home</a>
        <a href="hosting.html" class="navbar-mobile-link">Hosting</a>
        <a href="index.html#features" class="navbar-mobile-link">Features</a>
        <a href="status.html" class="navbar-mobile-link">Status</a>
        <a href="faq.html" class="navbar-mobile-link">FAQ</a>
        <div class="navbar-mobile-actions navbar-auth">
            <a href="login.html" class="btn btn-secondary">Login</a>
            <a href="register.html" class="btn btn-primary">Create Account</a>
        </div>
        <div class="navbar-mobile-actions navbar-user hidden">
            <a href="dashboard.html" class="btn btn-secondary">Dashboard</a>
            <a href="account.html" class="btn btn-secondary">Profile</a>
            <button id="logout-btn-mobile" class="btn btn-danger">Logout</button>
        </div>
    </div>

    <main class="section" style="padding-top: 100px; display: flex; align-items: center; min-height: calc(100vh - 64px);">
        <div class="container">
            <div class="card" style="max-width: 400px; margin: 0 auto;">
                <h1 style="text-align: center; margin-bottom: var(--spacing-lg);">Create Account</h1>
                <p style="text-align: center; color: var(--text-secondary); margin-bottom: var(--spacing-xl);">Sign up to start hosting your Discord bots</p>

                <form id="register-form">
                    <div class="form-group">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" id="username" name="username" class="form-input" placeholder="username" required>
                    </div>

                    <div class="form-group">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" id="email" name="email" class="form-input" placeholder="your@email.com" required>
                    </div>

                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword" class="form-label">Confirm Password</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" class="form-input" placeholder="••••••••" required>
                    </div>

                    <div class="form-group">
                        <label class="form-checkbox">
                            <input type="checkbox" name="agreeTerms" id="agreeTerms" required>
                            <span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</span>
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary btn-full">Create Account</button>
                </form>

                <div style="text-align: center; margin-top: var(--spacing-lg);">
                    <span style="color: var(--text-secondary);">Already have an account? </span>
                    <a href="login.html">Login</a>
                </div>
            </div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
