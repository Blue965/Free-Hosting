<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status - Free Hosting</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <a href="index.html" class="navbar-brand">
                <div class="navbar-logo">FH</div>
                <span class="navbar-name">Free Hosting</span>
            </a>
            <ul class="navbar-nav">
                <li><a href="index.html" class="navbar-link">Home</a></li>
                <li><a href="hosting.html" class="navbar-link">Hosting</a></li>
                <li><a href="index.html#features" class="navbar-link">Features</a></li>
                <li><a href="status.html" class="navbar-link active">Status</a></li>
                <li><a href="faq.html" class="navbar-link">FAQ</a></li>
            </ul>
            <div class="navbar-actions navbar-auth">
                <a href="login.html" class="btn btn-secondary">Login</a>
                <a href="register.html" class="btn btn-primary">Create Account</a>
            </div>
            <div class="navbar-actions navbar-user hidden">
                <a href="dashboard.html" class="btn btn-secondary">Dashboard</a>
                <a href="account.html" class="btn btn-secondary">Profile</a>
                <button id="logout-btn" class="btn btn-danger">Logout</button>
            </div>
            <button class="navbar-toggle" id="navbar-toggle">☰</button>
        </div>
    </nav>

    <div class="navbar-mobile" id="navbar-mobile">
        <a href="index.html" class="navbar-mobile-link">Home</a>
        <a href="hosting.html" class="navbar-mobile-link">Hosting</a>
        <a href="index.html#features" class="navbar-mobile-link">Features</a>
        <a href="status.html" class="navbar-mobile-link active">Status</a>
        <a href="faq.html" class="navbar-mobile-link">FAQ</a>
        <div class="navbar-mobile-actions navbar-auth">
            <a href="login.html" class="btn btn-secondary">Login</a>
            <a href="register.html" class="btn btn-primary">Create Account</a>
        </div>
        <div class="navbar-mobile-actions navbar-user hidden">
            <a href="dashboard.html" class="btn btn-secondary">Dashboard</a>
            <a href="account.html" class="btn btn-secondary">Profile</a>
            <button id="logout-btn-mobile" class="btn btn-danger">Logout</button>
        </div>
    </div>

    <main class="section" style="padding-top: 100px;">
        <div class="container">
            <h1 class="text-center mb-xl">System Status</h1>

            <div class="card" style="max-width: 800px; margin: 0 auto var(--spacing-xl);">
                <h2 style="margin-bottom: var(--spacing-lg);">Services</h2>
                <div id="status-services">
                    <div class="empty-state">Monitoring data unavailable</div>
                </div>
            </div>

            <div class="card" style="max-width: 800px; margin: 0 auto;">
                <h2 style="margin-bottom: var(--spacing-lg);">Incidents</h2>
                <div id="incidents-list">
                    <div class="empty-state">No incidents reported</div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/status.js"></script>
</body>
</html>
